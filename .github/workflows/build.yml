name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Creating a Release needs write access to repository contents. Pull requests
# from forks only get a read-only token, so the publish step is skipped there.
permissions:
  contents: write

jobs:
  # Compiles the C++/QML sources (libkg + zlib + mbedtls + app) on a hosted
  # runner. This target links Qt 5, which the project supports for
  # Windows/Android; it is a compile + startup regression check, not the
  # Symbian deliverable. Note that the QML here is QtQuick 1.0, so the Qt 5
  # desktop binary builds but cannot render its UI (QtQuick 1 was removed from
  # Qt in 5.6). Runtime testing belongs to the Symbian job below.
  linux:
    name: Linux / Qt 5 (compile only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtbase5-dev-tools qtdeclarative5-dev qt5-qmake

      # apisecrets.h is gitignored; the empty header is only a fallback. Each
      # user enters their own API ID/hash in the app (see apicredentials.cpp).
      - name: Write default libkg/apisecrets.h
        run: cp libkg/apisecrets.h.empty libkg/apisecrets.h

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../kutegramquick.pro CONFIG+=release
          make -j"$(nproc)"

      # The Qt 5 binary cannot be started for testing: its QML is QtQuick 1.0,
      # which Qt 5 does not ship, so setSource() fails and QQuickView aborts.
      # This check instead guards the class of bug that broke the build before
      # (a resource entry whose file name does not match the checkout).
      - name: Validate QML resources
        run: |
          python3 - <<'EOF'
          import re, os, sys
          missing = []
          for entry in re.findall(r"<file>([^<]+)</file>", open("resources.qrc").read()):
              if not os.path.exists(entry):
                  missing.append(entry)
          if missing:
              print("::error::resources.qrc references missing files:", *missing, sep="\n  ")
              sys.exit(1)
          print("All resources.qrc entries exist")
          EOF

      # No artifact is published here: this job is only a compile check. The
      # installable package is published as a Release by the Symbian job.

  # Produces an installable .sis for Symbian^3 / Belle.
  #
  # Builds the installable Symbian package.
  #
  # The toolchain (Qt SDK 1.2.1 + Symbian^3 Qt 4.7.4, GCCE 4.4.1, SBSv2 and
  # the E32/SIS tools) only ever shipped as a Windows install. The container
  # below carries it under Wine, together with a build script that runs
  # qmake -> sbs -> make sis for any Qt 4.7.4 project.
  #
  # Notes on the produced file:
  # - It is signed with the toolchain's development certificate, so a phone
  #   asks for confirmation on install (fine for personal use, not for the
  #   Nokia Store, which is gone anyway).
  # - Capabilities are the self-signable set. SwEvent needs a real developer
  #   certificate; build with CONFIG+=sw_event and a developer cert for that.
  symbian-sis:
    name: Symbian SIS (Belle + E51 / GCCE)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Optional project-wide defaults. Users can override them in the app;
      # without secrets the empty header is used and the first screen asks
      # for the credentials.
      - name: Write libkg/apisecrets.h
        env:
          API_ID: ${{ secrets.KUTEGRAM_API_ID }}
          API_HASH: ${{ secrets.KUTEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            cat > libkg/apisecrets.h <<EOF
          #ifndef APISECRETS_H
          #define APISECRETS_H

          #define KUTEGRAM_API_ID $API_ID
          #define KUTEGRAM_API_HASH "$API_HASH"

          #endif // APISECRETS_H
          EOF
          else
            cp libkg/apisecrets.h.empty libkg/apisecrets.h
          fi

      - name: Build signed SIS
        shell: bash
        run: |
          out="$RUNNER_TEMP/sis-out"
          mkdir -p "$out"
          # The script stages the project into the container's wine workspace,
          # so the checkout can stay read-only.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$out:/out" \
            keinedx2/symbian-belle-buildtools:final /work /out
          # The toolchain names the package after TARGET; keep a stable asset
          # name for the release download link.
          sis=$(find "$out" -maxdepth 1 -name '*.sis' -print -quit)
          if [ -z "$sis" ]; then
            echo "::error::No .sis produced by the toolchain" >&2
            exit 1
          fi
          cp "$sis" sisGram.sis

      - name: Verify SIS header
        shell: bash
        run: |
          python3 - <<'EOF'
          import struct
          data = open("sisGram.sis", "rb").read(40)
          uid1, _, uid3, _ = struct.unpack("<IIII", data[:16])
          assert uid1 == 0x10201A7A, hex(uid1)
          assert uid3 == 0xE0713D51, hex(uid3)
          print(f"SIS ok: uid3={uid3:#010x}")
          EOF

      # Ship the official Qt runtime SIS files from the Qt SDK inside the
      # build image, so users never have to download Qt from a third party.
      - name: Package official Qt runtimes
        shell: bash
        run: |
          set -euo pipefail
          QT_SIS=/opt/wine/drive_c/QtSDK/Symbian/sis
          IMAGE=keinedx2/symbian-belle-buildtools:final
          docker run --rm -v "$PWD:/out" --entrypoint cp "$IMAGE" \
            "$QT_SIS/Symbian_Anna/Qt/4.7.4/Qt-4.7.403-for-Anna.sis" /out/Qt-4.7.4-Symbian3-Belle.sis
          docker run --rm -v "$PWD:/out" --entrypoint cp "$IMAGE" \
            "$QT_SIS/S60_5th_Edition/Qt/4.7.3/Qt-4.7.3-for-S605th.sis" /out/Qt-4.7.3-S60-5th.sis
          python3 - <<'EOF'
          import struct
          expected = {
              "Qt-4.7.4-Symbian3-Belle.sis": 0x2001E61C,
              "Qt-4.7.3-S60-5th.sis": None,
          }
          for name, uid3 in expected.items():
              data = open(name, "rb").read(40)
              uid1, _, actual_uid3, _ = struct.unpack("<IIII", data[:16])
              assert uid1 == 0x10201A7A, (name, hex(uid1))
              if uid3 is not None:
                  assert actual_uid3 == uid3, (name, hex(actual_uid3))
              print(f"{name}: ok ({len(open(name, 'rb').read())} bytes)")
          EOF

      # The E51 QWidget port needs Qt 4.6.3, which is not in the Belle build
      # image. Download the original Nokia installer, verify its pinned hash,
      # then extract/build it entirely inside the non-root container.
      - name: Download official Qt SDK 1.1.2 installer (E51 toolchain)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            -o "$RUNNER_TEMP/Qt_SDK_Win_offline_v1_1_2_en.exe" \
            https://archive.org/download/nokia_sdks_n_dev_tools/Qt_SDK_Win_offline_v1_1_2_en.exe
          echo "ce16cbd7c99e607f51789d857fe8573852a999053a79af1fa20d645457044e30  $RUNNER_TEMP/Qt_SDK_Win_offline_v1_1_2_en.exe" | sha256sum -c -

      - name: Build S60 3rd FP1 / E51 SIS
        shell: bash
        run: |
          set -euo pipefail
          e51out="$RUNNER_TEMP/e51-out"
          e51work="$RUNNER_TEMP/e51-work"
          mkdir -p "$e51out" "$e51work"
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint bash \
            --user 1001:1003 \
            --network=none \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$e51work:/work" \
            -v "$e51out:/out" \
            -v "$RUNNER_TEMP/Qt_SDK_Win_offline_v1_1_2_en.exe:/work/installer.exe:ro" \
            -e API_ID="${{ secrets.KUTEGRAM_API_ID }}" \
            -e API_HASH="${{ secrets.KUTEGRAM_API_HASH }}" \
            keinedx2/symbian-belle-buildtools:final /src/tools/build-e51.sh

      - name: Verify E51 outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/e51-out/sisGram-E51.sis" <<'EOF'
          import struct, sys
          data = open(sys.argv[1], "rb").read(40)
          uid1, _, uid3, _ = struct.unpack("<IIII", data[:16])
          assert uid1 == 0x10201A7A, hex(uid1)
          assert uid3 == 0xE0713D52, hex(uid3)
          print(f"sisGram-E51.sis ok: uid3={uid3:#010x}")
          EOF
          echo "66dd2d9298ef172741211bafcf3b8179184daf2c4ab48894ba659379d51c77bd  $RUNNER_TEMP/e51-out/Qt-4.6.3-S60-3rd-FP1-SmartInstaller.sis" | sha256sum -c -

      - name: Publish SIS as a GitHub Release
        # Releases are only made for master pushes, version tags and manual
        # runs -- never for pull requests or feature branches.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="sisGram $TAG (Symbian)"
          else
            # Rolling release: the newest successful master build is always
            # available at /releases/latest/download/sisGram.sis
            TAG="symbian-latest"
            TITLE="sisGram Symbian (latest)"
          fi

          # Recreate the release so an old .sis is never left attached and the
          # rolling tag moves to the commit that was just built.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          {
            echo "**sisGram** is an unofficial Telegram client for Symbian, a fork of [Kutegram](https://github.com/kutegram/quick). Built from \`$GITHUB_SHA\`."
            echo
            echo "### Install"
            echo
            echo "1. Copy the files to the phone (USB / Bluetooth / memory card)."
            echo "2. Install the Qt runtime for your device **first**:"
            echo "   - Symbian^3 / Anna / Belle (N8, E7, C7, 700, 808...): \`Qt-4.7.4-Symbian3-Belle.sis\`"
            echo "   - S60 5th Edition (N97, 5800, X6...): \`Qt-4.7.3-S60-5th.sis\`"
            echo "   - S60 3rd Edition FP1 (Nokia E51, E71, N95...): \`Qt-4.6.3-S60-3rd-FP1-SmartInstaller.sis\`"
            echo "3. Then install the matching app package:"
            echo "   - \`sisGram.sis\` (UID3 \`0xE0713D51\`, Qt Quick) for Symbian^3 / Belle / S60 5th"
            echo "   - \`sisGram-E51.sis\` (UID3 \`0xE0713D52\`, QWidget port) for S60 3rd FP1"
            echo
            echo "All Qt packages are the official ones shipped inside Nokia Qt SDKs; no third-party downloads are needed. The E51 package is Nokia's Qt Smart Installer: it fetches the Qt 4.6.3 libraries from Nokia's servers, so it needs a working data connection at install time."
            echo
            echo "### Signing and capabilities"
            echo
            echo "Both SIS files are self-signed with the toolchain development certificate (the phone asks for confirmation). Capabilities: ReadUserData, WriteUserData, UserEnvironment, NetworkServices, LocalServices."
            echo
            echo "### Telegram API credentials"
            echo
            echo "Both builds have the project credentials pre-filled from repository secrets. You can replace them on the first screen with your own from my.telegram.org/apps; they are stored only on the device."
          } > release-notes.md

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            sisGram.sis \
            Qt-4.7.4-Symbian3-Belle.sis \
            Qt-4.7.3-S60-5th.sis \
            "$RUNNER_TEMP/e51-out/sisGram-E51.sis" \
            "$RUNNER_TEMP/e51-out/Qt-4.6.3-S60-3rd-FP1-SmartInstaller.sis"

          echo "::notice::Published sisGram.sis + sisGram-E51.sis + Qt runtimes at https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
