name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Telegram API credentials are NOT part of this repository (libkg/apisecrets.h
  # is generated at build time). Add KUTEGRAM_API_ID / KUTEGRAM_API_HASH as
  # repository secrets to build a client that can log in.
  HAS_API_SECRETS: ${{ secrets.KUTEGRAM_API_ID != '' }}

jobs:
  # Compiles the C++/QML sources (libkg + zlib + mbedtls + app) on a hosted
  # runner. This target links Qt 5, which the project supports for
  # Windows/Android; it is a compile + startup regression check, not the
  # Symbian deliverable. Note that the QML here is QtQuick 1.0, so the Qt 5
  # desktop binary builds but cannot render its UI (QtQuick 1 was removed from
  # Qt in 5.6). Runtime testing belongs to the Symbian job below.
  linux:
    name: Linux / Qt 5 (compile only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtbase5-dev-tools qtdeclarative5-dev qt5-qmake

      - name: Write libkg/apisecrets.h
        env:
          API_ID: ${{ secrets.KUTEGRAM_API_ID }}
          API_HASH: ${{ secrets.KUTEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            cat > libkg/apisecrets.h <<EOF
          #ifndef APISECRETS_H
          #define APISECRETS_H

          #define KUTEGRAM_API_ID $API_ID
          #define KUTEGRAM_API_HASH "$API_HASH"

          #endif // APISECRETS_H
          EOF
          else
            echo "::notice::KUTEGRAM_API_ID/KUTEGRAM_API_HASH not set, building with placeholder credentials"
            cp libkg/apisecrets.h.empty libkg/apisecrets.h
          fi

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../kutegramquick.pro CONFIG+=release
          make -j"$(nproc)"

      # The Qt 5 binary cannot be started for testing: its QML is QtQuick 1.0,
      # which Qt 5 does not ship, so setSource() fails and QQuickView aborts.
      # This check instead guards the class of bug that broke the build before
      # (a resource entry whose file name does not match the checkout).
      - name: Validate QML resources
        run: |
          python3 - <<'EOF'
          import re, os, sys
          missing = []
          for entry in re.findall(r"<file>([^<]+)</file>", open("resources.qrc").read()):
              if not os.path.exists(entry):
                  missing.append(entry)
          if missing:
              print("::error::resources.qrc references missing files:", *missing, sep="\n  ")
              sys.exit(1)
          print("All resources.qrc entries exist")
          EOF

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Kutegram-linux-qt5
          path: build/Kutegram
          if-no-files-found: error

  # Produces an installable .sis for Symbian^3 / Belle.
  #
  # Why self-hosted: building a SIS needs Qt 4.7.4 cross-built for the device
  # plus the Symbian^3 SDK (GCCE / SBSv2). The Qt SDK for Symbian was
  # Windows-only and the Symbian SDKs are not redistributable, so this cannot
  # run on GitHub-hosted runners.
  #
  # Setup: register a runner with labels [self-hosted, symbian] that has the
  # Qt 4.7.4 Symbian toolchain in PATH, then set the repository variable
  # SYMBIAN_BUILD=true (Settings > Secrets and variables > Actions > Variables).
  symbian-sis:
    name: Symbian SIS (self-hosted)
    if: vars.SYMBIAN_BUILD == 'true'
    runs-on: [self-hosted, symbian]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write libkg/apisecrets.h
        env:
          API_ID: ${{ secrets.KUTEGRAM_API_ID }}
          API_HASH: ${{ secrets.KUTEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            cat > libkg/apisecrets.h <<EOF
          #ifndef APISECRETS_H
          #define APISECRETS_H

          #define KUTEGRAM_API_ID $API_ID
          #define KUTEGRAM_API_HASH "$API_HASH"

          #endif // APISECRETS_H
          EOF
          else
            cp libkg/apisecrets.h.empty libkg/apisecrets.h
          fi

      - name: Build SIS
        shell: bash
        run: |
          # SYMBIAN_VERSION=Symbian3 enables the Qt library deployment rules in
          # kutegramquick.pro (and links the Pigler notification plugin).
          mkdir build-sis && cd build-sis
          qmake ../kutegramquick.pro \
            -spec symbian-gcce \
            CONFIG+=release \
            SYMBIAN_VERSION=Symbian3
          make -j"$(nproc)"
          make sis

      - name: Upload SIS
        uses: actions/upload-artifact@v4
        with:
          name: Kutegram-symbian3-sis
          path: build-sis/*.sis
          if-no-files-found: error
